[package]
name = "cynapse-synaptic-memory"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight 4-tier synaptic memory engine for AI coding agents"
license = "MIT"
authors = ["Xander <Alartist40>"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
